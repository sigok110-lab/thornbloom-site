<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornbloom</title>
<style>
:root { --bg:#f6f1e4; --paper:#fffaf0; --ink:#3d3226; --line:#d9cdb4; --accent:#5b7d3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#211d17; --paper:#2b261e; --ink:#efe6d4; --line:#4a4134; --accent:#9cc06f; } }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system, "Helvetica Neue", "Apple SD Gothic Neo", "Hiragino Sans", sans-serif; }
main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
section { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 20px 16px; }
a { color:var(--accent); }
</style>
</head>
<body>
<main>
<h1>Thornbloom</h1>
<section>
<p>A cozy block puzzle roguelite for iPhone. Win back Aunt Marigold's garden from the thorns, one 8x8 bed at a time.</p>
<p><a href="support/">Support</a> · <a href="privacy/">Privacy Policy</a></p>
</section>
</main>
</body>
</html>
